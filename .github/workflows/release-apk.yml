name: Build Release APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper

      - name: Prepare Release Signing Keystore
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.UPLOAD_KEYSTORE_BASE64 }}
          SECRET_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SECRET_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_FILE="${{ runner.temp }}/my-upload-key.jks"
          if [ -n "$UPLOAD_KEYSTORE_BASE64" ] && [ -n "$SECRET_STORE_PASSWORD" ] && [ -n "$SECRET_KEY_PASSWORD" ]; then
            echo "$UPLOAD_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_FILE"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$SECRET_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$SECRET_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            CI_PASS="freebooklive-upload-key"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias upload \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$CI_PASS" -keypass "$CI_PASS" \
              -dname "CN=FreebookLive, O=FreebookLive, C=US"
            echo "KEYSTORE_PATH=$KEYSTORE_FILE" >> "$GITHUB_ENV"
            echo "STORE_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
            echo "### Release Keystore Fingerprints (add to Firebase Console for Google Sign-In)" >> "$GITHUB_STEP_SUMMARY"
            keytool -list -v -keystore "$KEYSTORE_FILE" -alias upload -storepass "$CI_PASS" | grep -E "SHA1:|SHA256:" >> "$GITHUB_STEP_SUMMARY" || true
          fi

      - name: Build Signed Release APK
        run: gradle :app:assembleRelease

      - name: Verify Release APK Output
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: $APK_PATH was not generated"
            exit 1
          fi
          cp "$APK_PATH" "${{ runner.temp }}/RELEASE.APK"
          ls -lh "$APK_PATH" "${{ runner.temp }}/RELEASE.APK"

      - name: Upload RELEASE.APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreebookLive-RELEASE-APK
          path: ${{ runner.temp }}/RELEASE.APK

      - name: Create GitHub Release (on tags or manual run)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('release-{0}', github.run_number) }}
          name: FreebookLive ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Build #{0}', github.run_number) }}
          files: ${{ runner.temp }}/RELEASE.APK
